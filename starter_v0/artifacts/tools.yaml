# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# starter_v0 — tool declarations (optimized for v1).
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng khi thiếu thông tin (như thiếu Twitter handle, thiếu URL) bằng response_type='text' hoặc xin xác nhận trước khi đăng/gửi tin bằng response_type='yes_no'."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi cho người dùng"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời: 'text' khi cần xin thông tin thiếu, 'yes_no' khi cần xin xác nhận."}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây của một tài khoản Twitter dựa trên screenname (vd: sama, elonmusk, karpathy). Nếu thiếu screenname, dùng tool clarify."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản Twitter handle"}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng cần lấy"}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng trên Twitter theo từ khóa query. Dùng search_type='Top' cho bài hot/phổ biến, 'Latest' cho bài mới nhất."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm trên Twitter"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp bài đăng"}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng"}
      required: [query]

  - name: lookup
    description: "Tra cứu tin tức hoặc thông tin trên web. `query` là từ khóa chính (vd: 'AI'), `topic`='news' nếu tìm tin tức, `timeframe`='day'|'week'|'month'|'year' cho khoảng thời gian."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm chính"}
        topic: {type: string, enum: [general, news], default: "general", description: "Chủ đề: news (tin tức) hoặc general"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian: day (hôm nay), week (tuần này), month, year"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Tải và đọc nội dung văn bản từ một đường dẫn URL cụ thể."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ URL cụ thể cần đọc"}
      required: [url]

  - name: format
    description: "Trình bày danh sách dữ liệu thành văn bản digest."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn định dạng"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Đăng hoặc gửi một đoạn văn bản lên Telegram channel. CHỈ sử dụng khi người dùng yêu cầu gửi/đăng lên Telegram VÀ ĐÃ xác nhận yes/no qua clarify. KHÔNG dùng cho câu trả lời thông thường hay câu out-of-scope."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung tin nhắn cần gửi"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận từ người dùng"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu policy nội bộ công ty."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học trên arXiv."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa search"}
        max_results: {type: integer, default: 5, description: "Số lượng kết quả"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Cách sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Tải và trích xuất nội dung văn bản của một bài báo arXiv."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc URL của bài báo arXiv"}
        max_pages: {type: integer, default: 5, description: "Số trang tối đa"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự tối đa"}
      required: [arxiv_url]
  - name: save_note
    description: "Lưu một đoạn văn bản, ý tưởng hoặc kết quả nghiên cứu vào sổ tay ghi chú nội bộ. Chỉ dùng khi người dùng yêu cầu 'lưu', 'ghi lại', hoặc 'save'. KHÔNG dùng để gửi tin nhắn (dùng send). Cần xác nhận từ người dùng (confirmed=true) trước khi thực hiện lưu."
    parameters:
      type: object
      properties:
        content: {type: string, default: "", description: "Nội dung ghi chú cần lưu"}
        title: {type: string, default: "Untitled Note", description: "Tiêu đề của ghi chú"}
        category: {type: string, enum: [general, research, todo, idea], default: "research", description: "Phân loại ghi chú"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận từ người dùng"}
      required: [content]